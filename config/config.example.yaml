# Copy to config/config.yaml and edit. config.yaml is git-ignored.

# Which brokers to activate. Disabled brokers are ignored entirely.
brokers:
  paper:
    enabled: true
    starting_cash: 100000
  robinhood:
    enabled: false
  webull:
    enabled: false

# Symbols the portal tracks, analyzes, and can trade.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - SPY

# Risk limits — enforced on EVERY order before it reaches a broker.
risk:
  max_position_value: 5000      # max $ in any single symbol
  max_order_value: 2000         # max $ for one order
  max_orders_per_day: 20        # circuit breaker on order count
  max_daily_loss: 1000          # halt trading if realized loss exceeds this
  allowed_symbols_only: true    # only trade symbols on the watchlist

# Strategies to run. Each maps to a class in app/strategy/examples.py.
strategies:
  - name: sma_crossover
    symbols: [AAPL, MSFT, NVDA]
    params:
      fast: 10
      slow: 30
      order_value: 1000         # $ per signal
  - name: rsi_reversion
    symbols: [SPY]
    params:
      period: 14
      oversold: 30
      overbought: 70
      order_value: 1000

# How often the engine wakes up to pull data and evaluate strategies (seconds).
loop_interval_seconds: 60

# The Daily Agent — runs the full routine (analyze → blend conviction → size →
# route orders) once per day and produces a morning brief.
agent:
  run_at: "09:00"          # local time to fire the daily routine
  execute: true            # route conviction orders through the executor (mode-aware)
  # Forward-return forecaster feeding the "forecast" conviction source.
  #   naive     — pure-Python drift/significance estimate (default, no deps)
  #   chronos   — Amazon Chronos (HF)      chronos-2 | timesfm | kronos also accepted
  # HF models need `pip install` + a weight download and run locally. See docs/ML.md.
  forecast_model: naive
  sizing:
    base_budget: 1000      # $ per order at full conviction, average volatility
    entry_threshold: 0.2   # skip trades weaker than this |conviction|
    max_budget: 2000       # $ ceiling per order (risk manager still applies)
  # How much to trust each signal source in the conviction blend. Your own
  # sources (serenity, professor_jiang, personal) are first-class — set their
  # weight and feed scores in.
  conviction_weights:
    technical: 0.30
    analyst: 0.30          # Claude (Opus) rating; heuristic if no API key
    sentiment: 0.15
    geopolitical: 0.10
    serenity: 0.05
    professor_jiang: 0.05
    personal: 0.05

# The Campaign — the mission. Grow the EXISTING capital to the target by the
# deadline, concentrated in a few blue-chip volatile cycle plays, without giving
# the gains back. "make no mistake" = the trailing drawdown halt below.
campaign:
  target: 1000000               # $1M goal
  # start_capital: null         # defaults to your current book value at startup
  started: "2026-09-05"
  deadline: "2027-12-31"        # exit before the anticipated 2028 chip down-cycle
  focus_symbols: [MRVL, NVDA, TSLA]   # the names you want to play
  trailing_drawdown_halt: 0.20  # HALT all trading if the book falls >20% from its peak

# Tiered "pockets" allocation — a conviction barbell. Large pockets = core
# high-conviction positions; small pockets = asymmetric "gem" bets (find gems,
# don't chase hype). Ladder should sum to your investable fund.
allocation:
  fund: 80000                    # investable capital (defaults to your book value if omitted)
  gem_threshold: 2000            # pockets below this are "gem" (upside) bets; above are "core"
  pockets: [30000, 20000, 10000, 10000, 5000, 1000, 1000, 1000, 1000, 1000]
